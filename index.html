<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="HIIT reaction timer that calls random letters in a British voice.">
<meta name="theme-color" content="#161826">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letter Call">
<link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-semi-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:700 900;font-display:swap;src:url(fonts/big-shoulders-display.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}
</style>
<title>Letter Call Timer</title>
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Layout: one fixed-height column. The live "court" display on top flexes to fill; settings sit in one panel below;
   the transport buttons stay pinned at the bottom. Settings fold away while a session runs so the call fills the screen.
   Calls' own Before/After times are edited in a modal opened from the Calls header. */
:root{
  /* Iris Console palette: ground-1, ground-2, ground-4, edge-2, ink-1, ink-4, accent-700, accent-600.
     Iris is dark only, so there is no light theme. */
  --bg:#161826; --surface:#1b1d29; --surface-2:#232532; --line:#33363f; --fg:#e9e9ed; --muted:#9397ab;
  --accent:#5d5294; --focus:#796cbf;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --font-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --ctl:38px; --chip:30px; --gap:10px; --lbl:11px; --pad:12px;
  color-scheme:dark;
}
@media (max-height:760px){ :root{ --ctl:34px; --chip:27px; --gap:8px; --pad:10px; } }
@media (max-height:640px){ :root{ --ctl:30px; --chip:24px; --gap:6px; --lbl:10px; --pad:8px; } }

html{height:100%;box-sizing:border-box;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);
  font:500 15px/1.25 var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:var(--gap);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;
  --stage-bg:var(--surface);--stage-fg:var(--fg)}

/* ---------- Stage (the court) ---------- */
.stage{flex:1 1 auto;min-height:110px;position:relative;container-type:size;border-radius:2px;
  background:var(--stage-bg);color:var(--stage-fg);transition:background-color .12s linear,color .12s linear;
  display:grid;grid-template-rows:auto 1fr auto auto;padding:12px 16px 14px;overflow:hidden}
.stage::before{content:"";position:absolute;inset:8px;pointer-events:none;border:2px solid currentColor;opacity:.09;border-radius:2px}
.meta{display:flex;align-items:center;gap:10px;font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;
  position:relative;z-index:1;min-height:24px}
.meta .grow{flex:1}
.meta > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta .num{font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:2px;background:transparent;color:inherit;opacity:.75;padding:0}
.icon-btn:hover{opacity:1}
.icon-btn svg{width:18px;height:18px}
.pill{height:26px;padding:0 10px 0 8px;border-radius:2px;border:1.5px solid currentColor;background:transparent;color:inherit;
  font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;flex:none}
.pill svg{width:14px;height:14px}
.app.active .pill{display:none}
.wake{display:none;align-items:center;gap:4px;opacity:.75}
.wake svg{width:14px;height:14px}
.wake[data-state="on"],.wake[data-state="off"]{display:inline-flex}
.wake[data-state="off"]{opacity:1;color:var(--stage-fg)}
.glyph-wrap{display:grid;place-items:center;min-height:0;position:relative;z-index:1}
.glyph{font:900 min(68cqh,86cqw)/.8 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  text-align:center;white-space:nowrap;padding-top:.06em}
.glyph[data-len="2"]{font-size:min(60cqh,58cqw)}
.glyph[data-len="3"]{font-size:min(48cqh,38cqw)}
.glyph[data-len="4"]{font-size:min(40cqh,29cqw)}
.glyph[data-len="5"]{font-size:min(34cqh,23cqw)}
.glyph[data-len="6"]{font-size:min(30cqh,19cqw)}
.glyph[data-k="wait"]::after,.glyph[data-k="armed"]::after{content:"";display:block;width:16cqh;height:16cqh;border-radius:2px;border:2.2cqh solid currentColor;opacity:.55}
.glyph[data-k="armed"]::after{background:currentColor;opacity:.95}
.glyph.pop{animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.72);opacity:.4}to{transform:none;opacity:1}}
.phase{display:flex;align-items:baseline;justify-content:space-between;gap:12px;position:relative;z-index:1;margin-bottom:6px}
.phase-name{font:800 clamp(16px,6cqh,26px)/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.phase-time{font:800 clamp(16px,6cqh,26px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.paused .phase-name{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bar{height:6px;border-radius:2px;background:color-mix(in srgb,var(--stage-fg) 18%,transparent);overflow:hidden;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;background:var(--stage-fg);border-radius:2px}

/* ---------- Settings ---------- */
.settings{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease,opacity .2s;flex:0 0 auto}
.settings-in{min-height:0;overflow:hidden}
.app.active .settings{grid-template-rows:0fr;opacity:0;margin-top:calc(var(--gap) * -1)}
fieldset{border:0;margin:0;padding:var(--pad) 12px;min-width:0;background:var(--surface);border-radius:2px;display:grid;gap:var(--gap)}
.group{display:grid;gap:6px}
.group + .group{border-top:1px solid var(--line);padding-top:var(--gap)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;
  font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ghead .acts{display:flex;gap:6px;align-items:center}
.mini{height:24px;padding:0 8px;white-space:nowrap;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:700 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.mini svg{width:13px;height:13px}
.mini:disabled{opacity:.35}
.items{display:grid;gap:4px}
.chip{position:relative;height:var(--chip);min-width:0;padding:0;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:800 calc(var(--chip) * .6)/1 var(--font-display)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* Colour items: the swatch is the item; unpicked swatches are faded, picked ones carry a ring. */
.chip.colour{background:var(--c);color:var(--ci);border-color:transparent;opacity:.3;
  font:700 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.chip.colour[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--fg)}
/* A dot marks a call with its own Before/After. */
.chip.own::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;
  background:var(--focus);box-shadow:0 0 0 1.5px var(--bg)}
.hint-bad{color:var(--fg)}

.stepper{display:grid;grid-template-columns:27px minmax(0,1fr) 27px;height:var(--ctl);border:1px solid var(--line);border-radius:2px;background:var(--surface-2);overflow:hidden}
.stepper button{border:0;background:transparent;color:var(--fg);font:700 20px/1 var(--font-ui);padding:0;touch-action:none}
.stepper button:active{background:var(--line)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:700 16px/1 var(--font-ui);
  font-variant-numeric:tabular-nums;padding:0;user-select:text;-webkit-user-select:text}
.stepper input:focus{outline:none;background:var(--bg)}
.stepper.inherit input{color:var(--muted)}
fieldset:disabled .stepper,fieldset:disabled .chip,fieldset:disabled .mini,fieldset:disabled .seg{opacity:.5}

.session{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.cell{display:grid;gap:4px;min-width:0}
.clabel{font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:1fr 1fr;height:var(--ctl);border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--muted);font:700 14px/1 var(--font-ui);display:flex;align-items:center;justify-content:center;padding:0 2px;min-width:0;overflow:hidden}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg svg{width:22px;height:22px;flex:none}
.seg.modes{grid-template-columns:repeat(3,1fr)}
.seg.modes button{font:700 16px/1 var(--font-ui);letter-spacing:.03em}

/* ---------- Transport ---------- */
.transport{display:grid;grid-template-columns:1fr 2fr;gap:10px;flex:0 0 auto}
.btn{height:calc(var(--ctl) + 16px);border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:800 20px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:20px;height:20px}
.btn.primary{border:0;background:var(--accent);color:var(--fg);font-size:24px}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- Own times (modal) ---------- */
.dlg{width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);padding:0;border:1px solid var(--line);border-radius:2px;
  background:var(--surface);color:var(--fg);overflow:hidden}
.dlg[open]{display:flex;flex-direction:column}
.dlg::backdrop{background:rgba(8,9,14,.72)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 6px 16px}
.dlg-head h2{margin:0;font:800 22px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.dlg-note{margin:0;padding:0 16px 10px;font:600 13px/1.3 var(--font-ui);color:var(--muted)}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.thead{padding:0 16px 6px;font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tlist{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;gap:6px;align-content:start;padding:2px 16px 12px}
.tempty{margin:0;padding:8px 0 4px;font:600 14px/1.3 var(--font-ui);color:var(--muted)}
.ibadge{height:var(--ctl);display:grid;place-items:center;border-radius:2px;background:var(--fg);color:var(--bg);position:relative;
  font:800 calc(var(--ctl) * .62)/1 var(--font-display)}
.ibadge.colour{background:var(--c);color:var(--ci);font:700 9px/1 var(--font-ui);letter-spacing:.04em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px rgba(233,233,237,.25)}
.ireset{height:var(--ctl);border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--fg);display:grid;place-items:center;padding:0}
.ireset svg{width:18px;height:18px}
.ireset:disabled{opacity:.3;cursor:default}
.dlg-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.dlg-foot .btn{font-size:18px}
.dlg-foot .btn.primary{font-size:20px}

@media (orientation:landscape) and (max-height:520px){
  .app{max-width:none;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"stage settings" "stage transport";column-gap:14px}
  .stage{grid-area:stage;min-height:0}
  .settings{grid-area:settings;min-height:0}
  .settings-in{overflow:auto}
  .transport{grid-area:transport}
  .app.active{grid-template-areas:"stage transport" "stage settings";grid-template-rows:auto 1fr}
}
@media (prefers-reduced-motion:reduce){ .glyph.pop{animation:none} .settings{transition:none} .paused .phase-name{animation:none} }
</style>

</head>
<body>
<div class="app" id="app" data-phase="idle">
  <section class="stage" id="stage" aria-label="Live display">
    <div class="meta">
      <span id="metaL" class="num">Call timer</span>
      <span class="grow"></span>
      <span id="metaR" class="num"></span>
      <span class="wake" id="wake" title="Keeps the screen awake while a session runs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="wakeTxt"></span>
      </span>
      <button class="pill" id="installBtn" type="button" title="Install Letter Call as an app on this phone" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Install</button>
      <button class="icon-btn" id="fsBtn" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="glyph-wrap"><div class="glyph" id="glyph" data-len="4">0:00</div></div>
    <div class="phase"><span class="phase-name" id="phaseName">Ready</span><span class="phase-time" id="phaseTime"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <div class="settings" id="settings"><div class="settings-in">
    <fieldset id="cfgSet">
      <legend hidden>Session settings</legend>
      <div class="group">
        <div class="seg modes" id="modeSeg" role="group" aria-label="What to call">
          <button type="button" data-mode="letters">Letters</button>
          <button type="button" data-mode="digits">Digits</button>
          <button type="button" data-mode="colours">Colours</button>
        </div>
        <div class="ghead">
          <span id="callsHead">Calls</span>
          <span class="acts">
            <button class="mini" id="timesBtn" type="button" title="Give the picked calls their own Before and After">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span id="timesBtnTxt">Own times</span></button>
            <button class="mini" id="allBtn" type="button">All</button>
            <button class="mini" id="noneBtn" type="button">None</button>
          </span>
        </div>
        <div class="items" id="items" role="group" aria-label="Calls in the draw"></div>
      </div>

      <div class="group">
        <div class="session">
          <div class="cell"><span class="clabel" title="Default time before a call; a call's own time replaces it">Before · s</span><div class="stepper" data-field="before"></div></div>
          <div class="cell"><span class="clabel" title="Default time after a call; a call's own time replaces it">After · s</span><div class="stepper" data-field="after"></div></div>
          <div class="cell"><span class="clabel" title="Also play the beep this long before each call">Pre-beep · s</span><div class="stepper" data-field="preBeep"></div></div>
          <div class="cell"><span class="clabel">Calls / cycle</span><div class="stepper" data-field="count"></div></div>
          <div class="cell"><span class="clabel">Cycles</span><div class="stepper" data-field="cycles"></div></div>
          <div class="cell"><span class="clabel">Rest · s</span><div class="stepper" data-field="rest"></div></div>
          <div class="cell"><span class="clabel" title="Whether the same call can be called twice in a row">Repeats</span>
            <div class="seg" id="repeatSeg" role="group" aria-label="Repeats">
              <button type="button" data-on="1" aria-label="Repeats allowed" title="The same call can come twice in a row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
              <button type="button" data-on="0" aria-label="No repeats" title="Never the same call twice in a row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </div>
          </div>
          <div class="cell"><span class="clabel" title="Beep between calls, when the Before time starts">Beep between</span>
            <div class="seg" id="beepSeg" role="group" aria-label="Beep between calls">
              <button type="button" data-on="1" aria-label="Beep between calls on" title="Beep between calls: on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
              <button type="button" data-on="0" aria-label="Beep between calls off" title="Beep between calls: off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </div>
          </div>
          <div class="cell"><span class="clabel">Voice</span>
            <div class="seg" id="voiceSeg" role="group" aria-label="Voice (tap to hear it)">
              <button type="button" data-voice="bf_emma" aria-label="Female voice" title="Female voice: tap to hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="M12 14.5V22M8.5 18.5h7"/></svg></button>
              <button type="button" data-voice="bm_george" aria-label="Male voice" title="Male voice: tap to hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="14" r="5.5"/><path d="M14 10l6-6M15 4h5v5"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </fieldset>
  </div></div>

  <div class="transport">
    <button class="btn" id="resetBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
    <button class="btn primary" id="mainBtn" type="button" data-mode="start"><span id="mainIco"></span><span id="mainTxt">Start</span></button>
  </div>
</div>

<dialog class="dlg" id="timesDlg" aria-labelledby="timesTitle">
  <div class="dlg-head">
    <h2 id="timesTitle">Own times</h2>
    <button class="icon-btn" id="timesClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="dlg-note" id="timesNote"></p>
  <div class="trow thead" aria-hidden="true"><span>Call</span><span>Before · s</span><span>After · s</span><span></span></div>
  <div class="tlist" id="timesList"></div>
  <div class="dlg-foot">
    <button class="btn" id="clearTimesBtn" type="button">Clear all</button>
    <button class="btn primary" id="timesDone" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</button>
  </div>
</dialog>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);

/* ===================== What can be called ===================== */
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const DIGITS = '0123456789'.split('');
// The ten basic colour terms most languages share (grey left out: too close to the page itself).
const COLOURS = [
  { id: 'red', name: 'Red', hex: '#e53935' }, { id: 'orange', name: 'Orange', hex: '#fb8c00' },
  { id: 'yellow', name: 'Yellow', hex: '#fdd835' }, { id: 'green', name: 'Green', hex: '#43a047' },
  { id: 'blue', name: 'Blue', hex: '#1e88e5' }, { id: 'purple', name: 'Purple', hex: '#8e24aa' },
  { id: 'pink', name: 'Pink', hex: '#f06292' }, { id: 'brown', name: 'Brown', hex: '#795548' },
  { id: 'black', name: 'Black', hex: '#000000' }, { id: 'white', name: 'White', hex: '#ffffff' },
];
const COLOUR = Object.fromEntries(COLOURS.map((c) => [c.id, c]));
(() => {   // text on a colour: white or near-black, whichever contrasts more
  const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0); };
  const dark = '#111318', Ld = lum(dark);
  COLOURS.forEach((c) => { const L = lum(c.hex); c.ink = 1.05 / (L + 0.05) >= (L + 0.05) / (Ld + 0.05) ? '#ffffff' : dark; });
})();
// Only one kind is drawn at a time; each kind keeps its own picks.
const MODES = {
  letters: { name: 'Letters', one: 'letter', items: ALPHA, cols: 13 },
  digits:  { name: 'Digits', one: 'digit', items: DIGITS, cols: 5 },
  colours: { name: 'Colours', one: 'colour', items: COLOURS.map((c) => c.id), cols: 5 },
};
const isColour = (id) => Object.prototype.hasOwnProperty.call(COLOUR, id);
const callText = (id) => (isColour(id) ? COLOUR[id].name.toUpperCase() : id);   // what the display shows
const callName = (id) => (isColour(id) ? COLOUR[id].name : id);                 // what labels say
const itemExists = (id) => ALPHA.includes(id) || DIGITS.includes(id) || isColour(id);

const STORE_KEY = 'letter-call-timer:v5';
const V4_KEY = 'letter-call-timer:v4';
// Older saved settings carry over: up to v4 one string held letters and digits together; v2/v3 timings restart from
// the defaults (they moved from tenths to hundredths) and v2 takes the pre-beep default unless it had been switched on.
const OLD_STORE_KEYS = ['letter-call-timer:v3', 'letter-call-timer:v2'];

/* ===================== Config ===================== */
// Times are stored as integers to keep the arithmetic exact: Before/After in hundredths of a second, moving in steps
// of 5 (0.05 s); the pre-beep in tenths. itemBefore/itemAfter edit one call's own times (cfg.times).
const FIELDS = {
  before:     { min: 0, max: 5995, step: 5, hundredths: true },
  beforeMax:  { min: 5, max: 6000, step: 5, hundredths: true },   // Random range (off for now)
  after:      { min: 0, max: 5995, step: 5, hundredths: true },
  afterMax:   { min: 5, max: 6000, step: 5, hundredths: true },   // Random range (off for now)
  count:      { min: 1, max: 99 },
  cycles:     { min: 0, max: 99, inf: true },   // 0 = endless
  rest:       { min: 4, max: 600 },
  preBeep:    { min: 0, max: 30, tenths: true, off: true, on: 5 },   // 0 = off; first tap on + gives 0.5 s
  itemBefore: { min: 0, max: 5995, step: 5, hundredths: true, item: 'b' },
  itemAfter:  { min: 0, max: 5995, step: 5, hundredths: true, item: 'a' },
};
// The countdown at Start: 5-4-3-2-1, one per second, then the first call. It is not counted in the session time.
const START_COUNT = 5;
// With the between-call beep on, a pre-beep that would land this close to it is skipped: they would sound like one.
const MIN_BEEP_GAP_H = 30;   // in hundredths of a second (0.30 s); integers keep the comparison exact
const DEFAULTS = { mode: 'letters',
  picks: { letters: ['A', 'B', 'C', 'D'], digits: ['1', '2', '3', '4'], colours: ['red', 'yellow', 'green', 'blue'] },
  times: {},   // id -> { b?: hundredths, a?: hundredths }: a call's own Before/After
  noRepeat: false, range: false,
  before: 100, beforeMax: 200, after: 100, afterMax: 200, count: 12, cycles: 8, rest: 15, preBeep: 5, betweenBeep: true,
  voice: 'bf_emma' };

const readJSON = (key) => { const s = JSON.parse(localStorage.getItem(key) || 'null'); return s && typeof s === 'object' ? s : null; };
function loadCfg() {
  let c = { ...DEFAULTS };
  try {
    let s = readJSON(STORE_KEY);
    if (!s) {
      s = readJSON(V4_KEY);
      if (!s) {
        for (const key of OLD_STORE_KEYS) { s = readJSON(key); if (s) { if (key.endsWith('v2') && !(s.preBeep > 0)) delete s.preBeep; break; } }
        if (s) ['before', 'beforeMax', 'after', 'afterMax', 'range'].forEach((k) => delete s[k]);
      }
      if (s && typeof s.letters === 'string') {
        const str = s.letters, L = ALPHA.filter((x) => str.includes(x)), D = DIGITS.filter((x) => str.includes(x));
        s.picks = { letters: L, digits: D.length ? D : DEFAULTS.picks.digits, colours: DEFAULTS.picks.colours };
        s.mode = L.length || !D.length ? 'letters' : 'digits';
      }
      if (s) delete s.letters;
    }
    if (s) c = { ...c, ...s };
  } catch (e) {}
  for (const k in FIELDS) { const f = FIELDS[k]; if (f.item) continue; const st = f.step || 1; c[k] = Math.min(f.max, Math.max(f.min, Math.round((+c[k] || 0) / st) * st)); }
  if (c.beforeMax <= c.before) c.beforeMax = c.before + FIELDS.beforeMax.step;
  if (c.afterMax <= c.after) c.afterMax = c.after + FIELDS.afterMax.step;
  c.range = false;   // Random range is switched off for now; its logic is kept for later
  delete c.prep;     // Get ready is no longer a setting
  if (!MODES[c.mode]) c.mode = DEFAULTS.mode;
  const picks = c.picks && typeof c.picks === 'object' ? c.picks : {};
  c.picks = {};
  for (const m in MODES) { const arr = Array.isArray(picks[m]) ? picks[m] : DEFAULTS.picks[m]; c.picks[m] = MODES[m].items.filter((x) => arr.includes(x)); }
  const times = c.times && typeof c.times === 'object' ? c.times : {};
  c.times = {};
  for (const id in times) {
    if (!itemExists(id) || !times[id] || typeof times[id] !== 'object') continue;
    const o = {};
    for (const f of ['b', 'a']) { const v = Math.round(+times[id][f] / 5) * 5; if (Number.isFinite(v)) o[f] = Math.min(5995, Math.max(0, v)); }
    if (Object.keys(o).length) c.times[id] = o;
  }
  if (!['bf_emma', 'bm_george'].includes(c.voice)) c.voice = DEFAULTS.voice;
  c.betweenBeep = c.betweenBeep !== false;
  return c;

    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (isColour(id) ? ' colour' : ''); b.dataset.id = id;
    b.textContent = callName(id); setSwatch(b, id);
    b.addEventListener('click', () => {
      const set = new Set(pool()); set.has(id) ? set.delete(id) : set.add(id);
      cfg.picks[cfg.mode] = m.items.filter((x) => set.has(x)); saveCfg(); syncSettings();
    });
    itemsEl.appendChild(b);
  });
  builtMode = cfg.mode;
}
$('#allBtn').addEventListener('click', () => { cfg.picks[cfg.mode] = MODES[cfg.mode].items.slice(); saveCfg(); syncSettings(); });
$('#noneBtn').addEventListener('click', () => { cfg.picks[cfg.mode] = []; saveCfg(); syncSettings(); });

// On/off choices shown like the voice picker: tick for on, cross for off. "Repeats" reads the noRepeat setting inverted.
const ONOFF = [['beepSeg', 'betweenBeep', false], ['repeatSeg', 'noRepeat', true]];
ONOFF.forEach(([id, key, inverted]) => document.querySelectorAll('#' + id + ' button').forEach((b) =>
  b.addEventListener('click', () => { const on = b.dataset.on === '1'; cfg[key] = inverted ? !on : on; saveCfg(); syncSettings(); })));

const LABELS = { before: 'Default seconds before a call', beforeMax: 'Longest time before a call', after: 'Default seconds after a call',
  afterMax: 'Longest time after a call', count: 'Calls per cycle', cycles: 'Number of cycles', rest: 'Rest between cycles in seconds',
  preBeep: 'Seconds before each call to also beep, or Off', itemBefore: 'Seconds before', itemAfter: 'Seconds after' };
// Steppers: tap for one step, hold to repeat (speeds up the longer you hold).
function bindStepper(box) {
  const k = box.dataset.field, id = box.dataset.id, f = FIELDS[k];
  const label = LABELS[k] + (id ? ' ' + callName(id) : '');
  box.innerHTML = '<button type="button" aria-label="Decrease">−</button><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false"><button type="button" aria-label="Increase">+</button>';
  const [dec, inp, inc] = box.children;
  inp.id = 'f-' + k + (id ? '-' + id : ''); inp.setAttribute('aria-label', label);
  dec.setAttribute('aria-label', 'Decrease ' + label); inc.setAttribute('aria-label', 'Increase ' + label);
  const bindHold = (btn, dir) => {
    let timer = 0, t0 = 0;
    const stepOnce = () => { const held = performance.now() - t0; const mult = held > 2600 ? 10 : held > 1200 ? 5 : 1; bump(dir * mult); };
    const bump = (d) => { const v = getVal(k, id); if (f.off && v === 0 && d > 0) setVal(k, f.on, id); else setVal(k, v + d * (f.step || 1), id); };
    const stop = () => { clearTimeout(timer); timer = 0; };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return; e.preventDefault(); btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
      t0 = performance.now(); stepOnce();
      const rep = () => { stepOnce(); timer = setTimeout(rep, 70); };
      timer = setTimeout(rep, 420);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('click', (e) => { if (e.detail === 0) bump(dir); }); // keyboard
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  };
  bindHold(dec, -1); bindHold(inc, +1);
  const commit = () => {
    const raw = inp.value.trim().replace(',', '.');
    if ((f.inf || f.off) && (raw === '' || raw === '∞' || raw === '0' || /^off$/i.test(raw))) { setVal(k, 0, id); return; }
    const n = parseFloat(raw);
    if (isNaN(n)) { syncSettings(); return; }
    setVal(k, f.hundredths ? Math.round(n * 20) * 5 : f.tenths ? Math.round(n * 10) : n, id);
  };
  inp.addEventListener('change', commit);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
  inp.addEventListener('focus', () => setTimeout(() => inp.select(), 0));
}
document.querySelectorAll('.stepper').forEach(bindStepper);

// Voice
document.querySelectorAll('#voiceSeg button').forEach((b) => {
  b.addEventListener('click', async () => {
    cfg.voice = b.dataset.voice; saveCfg(); syncSettings();
    if (!ensureAudio()) return;
    await voicesReady;
    const p = pool().length ? pool() : MODES[cfg.mode].items;
    playClip(p[Math.floor(Math.random() * p.length)], ctx.currentTime + 0.02, voiceBus, cfg.voice);
  });
});

/* ===================== Own times (modal) ===================== */
// Every picked call of the current kind gets a row: its Before and After, greyed while they follow the defaults.
const dlg = $('#timesDlg'), listEl = $('#timesList');
const RESET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
function buildTimesList() {
  listEl.innerHTML = '';
  const p = pool();
  if (!p.length) { const e = document.createElement('p'); e.className = 'tempty'; e.textContent = 'Pick at least one ' + MODES[cfg.mode].one + ' first.'; listEl.appendChild(e); return; }
  p.forEach((id) => {
    const row = document.createElement('div'); row.className = 'trow';
    const badge = document.createElement('span'); badge.className = 'ibadge' + (isColour(id) ? ' colour' : ''); badge.textContent = callName(id); setSwatch(badge, id);
    row.appendChild(badge);
    for (const k of ['itemBefore', 'itemAfter']) { const s = document.createElement('div'); s.className = 'stepper'; s.dataset.field = k; s.dataset.id = id; row.appendChild(s); bindStepper(s); }
    const r = document.createElement('button'); r.type = 'button'; r.className = 'ireset'; r.dataset.id = id; r.innerHTML = RESET_SVG;
    r.setAttribute('aria-label', 'Use the default times for ' + callName(id)); r.title = 'Back to the default Before and After';
    r.addEventListener('click', () => { delete cfg.times[id]; saveCfg(); syncSettings(); });
    row.appendChild(r);
    listEl.appendChild(row);
  });
}
function openTimes() {
  if (S.status === 'running' || S.status === 'paused') return;
  $('#timesTitle').textContent = 'Own times · ' + MODES[cfg.mode].name;
  buildTimesList(); syncSettings();
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
}
function closeTimes() { if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
$('#timesBtn').addEventListener('click', openTimes);
$('#timesClose').addEventListener('click', closeTimes);
$('#timesDone').addEventListener('click', closeTimes);
dlg.addEventListener('click', (e) => { if (e.target === dlg) closeTimes(); });   // tap on the dimmed backdrop
dlg.addEventListener('close', () => { listEl.innerHTML = ''; syncSettings(); });
$('#clearTimesBtn').addEventListener('click', () => { pool().forEach((id) => delete cfg.times[id]); saveCfg(); syncSettings(); });

/* ===================== Keeping the screen in step with the settings ===================== */
function syncSettings() {
  if (builtMode !== cfg.mode) buildItems();
  const p = new Set(pool());
  itemsEl.querySelectorAll('.chip').forEach((c) => {
    const id = c.dataset.id;
    c.setAttribute('aria-pressed', p.has(id) ? 'true' : 'false');
    c.classList.toggle('own', !!cfg.times[id]);
    c.title = callName(id) + (cfg.times[id] ? ' (own times)' : '');
  });
  document.querySelectorAll('#modeSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === cfg.mode ? 'true' : 'false'));
  const n = p.size, head = $('#callsHead');
  head.textContent = n ? 'Calls · ' + n : 'Pick at least one ' + MODES[cfg.mode].one;
  head.classList.toggle('hint-bad', !n);
  const own = pool().filter((id) => cfg.times[id]).length;
  $('#timesBtnTxt').textContent = own ? 'Own times · ' + own : 'Own times';
  ONOFF.forEach(([id, key, inverted]) => document.querySelectorAll('#' + id + ' button').forEach((b) =>
    b.setAttribute('aria-pressed', String((b.dataset.on === '1') === (inverted ? !cfg[key] : !!cfg[key])))));
  document.querySelectorAll('.stepper').forEach((box) => {
    const k = box.dataset.field, id = box.dataset.id, inp = box.children[1];
    if (document.activeElement !== inp) inp.value = fmtField(k, id);
    if (id) box.classList.toggle('inherit', ownH(id, FIELDS[k].item) === undefined);
  });
  listEl.querySelectorAll('.ireset').forEach((r) => { r.disabled = !cfg.times[r.dataset.id]; });
  $('#clearTimesBtn').disabled = !own;
  $('#timesNote').textContent = 'Defaults: Before ' + (cfg.before / 100).toFixed(2) + ' s · After ' + (cfg.after / 100).toFixed(2) +
    ' s. Change a value to give that call its own time; grey values follow the defaults.';
  document.querySelectorAll('#voiceSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.voice === cfg.voice ? 'true' : 'false'));
  syncUI();
}
syncSettings();

// Warm up the audio engine on the first touch so Start responds instantly.
window.addEventListener('pointerdown', () => { ensureAudio(); }, { once: true, capture: true });
})();
</script>

</body>
