<title>Letter Call Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1416">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one fixed-height column. The live "court" display on top flexes to fill; settings sit in one panel below;
   the transport buttons stay pinned at the bottom. Settings fold away while a session runs so the call fills the screen. */
:root{
  --bg:#0b1416; --surface:#111d20; --surface-2:#1a2a2e; --line:#26393e; --fg:#e8f0ee; --muted:#8aa39d;
  --go:#119a5e; --count:#f0a417; --stop:#e3463d; --rest:#2f58c6; --focus:#7fd3b4;
  --on-phase:#ffffff; --on-count:#1c1404;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --font-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --ctl:38px; --chip:30px; --gap:10px; --lbl:11px; --pad:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#e7eeeb; --surface:#ffffff; --surface-2:#dbe6e2; --line:#c3d3cd; --fg:#0f1b1c; --muted:#56706a;
  --go:#0e8a54; --count:#ec9f12; --stop:#d63a31; --rest:#2a50ba; --focus:#0e8a54; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#e7eeeb; --surface:#ffffff; --surface-2:#dbe6e2; --line:#c3d3cd; --fg:#0f1b1c; --muted:#56706a;
  --go:#0e8a54; --count:#ec9f12; --stop:#d63a31; --rest:#2a50ba; --focus:#0e8a54; color-scheme:light; }
:root[data-theme="dark"]{
  --bg:#0b1416; --surface:#111d20; --surface-2:#1a2a2e; --line:#26393e; --fg:#e8f0ee; --muted:#8aa39d;
  --go:#119a5e; --count:#f0a417; --stop:#e3463d; --rest:#2f58c6; --focus:#7fd3b4; color-scheme:dark; }
@media (max-height:760px){ :root{ --ctl:34px; --chip:27px; --gap:8px; --pad:10px; } }
@media (max-height:640px){ :root{ --ctl:30px; --chip:24px; --gap:6px; --lbl:10px; --pad:8px; } }

html{height:100%;box-sizing:border-box;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);
  font:500 15px/1.25 var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:var(--gap);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;
  --stage-bg:var(--surface);--stage-fg:var(--fg)}

/* ---------- Stage (the court) ---------- */
.stage{flex:1 1 auto;min-height:140px;position:relative;container-type:size;border-radius:16px;
  background:var(--stage-bg);color:var(--stage-fg);transition:background-color .12s linear,color .12s linear;
  display:grid;grid-template-rows:auto 1fr auto auto;padding:12px 16px 14px;overflow:hidden}
.stage::before{content:"";position:absolute;inset:8px;pointer-events:none;border:2px solid currentColor;opacity:.09;border-radius:6px}
.meta{display:flex;align-items:center;gap:10px;font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;
  position:relative;z-index:1;min-height:24px}
.meta .grow{flex:1}
.meta > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta .num{font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:inherit;opacity:.75}
.icon-btn:hover{opacity:1}
.icon-btn svg{width:18px;height:18px}
.pill{height:26px;padding:0 10px 0 8px;border-radius:13px;border:1.5px solid currentColor;background:transparent;color:inherit;
  font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;flex:none}
.pill svg{width:14px;height:14px}
.app.active .pill{display:none}
.wake{display:none;align-items:center;gap:4px;opacity:.75}
.wake svg{width:14px;height:14px}
.wake[data-state="on"],.wake[data-state="off"]{display:inline-flex}
.wake[data-state="off"]{opacity:1;color:var(--stage-fg)}
.glyph-wrap{display:grid;place-items:center;min-height:0;position:relative;z-index:1}
.glyph{font:900 min(68cqh,86cqw)/.8 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  text-align:center;white-space:nowrap;padding-top:.06em}
.glyph[data-len="2"]{font-size:min(60cqh,58cqw)}
.glyph[data-len="3"]{font-size:min(48cqh,38cqw)}
.glyph[data-len="4"]{font-size:min(40cqh,29cqw)}
.glyph[data-len="5"]{font-size:min(34cqh,23cqw)}
.glyph[data-k="wait"]::after,.glyph[data-k="armed"]::after{content:"";display:block;width:16cqh;height:16cqh;border-radius:50%;border:2.2cqh solid currentColor;opacity:.55}
.glyph[data-k="armed"]::after{background:currentColor;opacity:.95}
.glyph.pop{animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.72);opacity:.4}to{transform:none;opacity:1}}
.phase{display:flex;align-items:baseline;justify-content:space-between;gap:12px;position:relative;z-index:1;margin-bottom:6px}
.phase-name{font:800 clamp(16px,6cqh,26px)/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.phase-time{font:800 clamp(16px,6cqh,26px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.paused .phase-name{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--stage-fg) 18%,transparent);overflow:hidden;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;background:var(--stage-fg);border-radius:3px}

.app[data-phase="go"],.app[data-phase="done"]{--stage-bg:var(--go);--stage-fg:var(--on-phase)}
.app[data-phase="count"]{--stage-bg:var(--count);--stage-fg:var(--on-count)}
.app[data-phase="stop"]{--stage-bg:var(--stop);--stage-fg:var(--on-phase)}
.app[data-phase="rest"],.app[data-phase="prep"]{--stage-bg:var(--rest);--stage-fg:var(--on-phase)}
.app[data-phase="wait"]{--stage-bg:var(--surface-2)}

/* ---------- Settings ---------- */
.settings{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease,opacity .2s;flex:0 0 auto}
.settings-in{min-height:0;overflow:hidden}
.app.active .settings{grid-template-rows:0fr;opacity:0;margin-top:calc(var(--gap) * -1)}
fieldset{border:0;margin:0;padding:var(--pad) 12px;min-width:0;background:var(--surface);border-radius:14px;display:grid;gap:var(--gap)}
.group{display:grid;gap:6px}
.group + .group{border-top:1px solid var(--line);padding-top:var(--gap)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px;
  font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ghead .acts{display:flex;gap:6px;align-items:center}
.ghead .acts.switches{gap:14px}
.mini{height:22px;padding:0 8px;white-space:nowrap;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:700 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase}
.mini[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.letters{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.chip{height:var(--chip);min-width:0;padding:0;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:800 calc(var(--chip) * .6)/1 var(--font-display)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hint-bad{color:var(--stop)}

.timing{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center}
.rlabel{font:600 14px/1 var(--font-ui);color:var(--fg)}
.to{font:600 12px/1 var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.timing .maxcol{transition:opacity .15s}
.range-off .maxcol{opacity:.32}

.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--fg);text-transform:none;letter-spacing:.02em;font:600 13px/1 var(--font-ui)}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--go)}
.switch input:checked::after{transform:translateX(14px);background:#fff}

.stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;height:var(--ctl);border:1px solid var(--line);border-radius:9px;background:var(--surface-2);overflow:hidden}
.stepper button{border:0;background:transparent;color:var(--fg);font:700 20px/1 var(--font-ui);padding:0;touch-action:none}
.stepper button:active{background:var(--line)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:700 17px/1 var(--font-ui);
  font-variant-numeric:tabular-nums;padding:0;user-select:text;-webkit-user-select:text}
.stepper input:focus{outline:none;background:var(--bg)}
fieldset:disabled .stepper,fieldset:disabled .chip,fieldset:disabled .mini,fieldset:disabled .seg{opacity:.5}

.session{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.cell{display:grid;gap:4px;min-width:0}
.clabel{font:700 var(--lbl)/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:1fr 1fr;height:var(--ctl);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--muted);font:700 14px/1 var(--font-ui);display:flex;align-items:center;justify-content:center;padding:0 2px;min-width:0;overflow:hidden}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* ---------- Transport ---------- */
.transport{display:grid;grid-template-columns:1fr 2fr;gap:10px;flex:0 0 auto}
.btn{height:calc(var(--ctl) + 16px);border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:800 20px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:20px;height:20px}
.btn.primary{border:0;background:var(--go);color:#fff;font-size:24px}
.btn.primary[data-mode="pause"]{background:var(--count);color:var(--on-count)}
.btn:disabled{opacity:.4;cursor:default}

@media (orientation:landscape) and (max-height:520px){
  .app{max-width:none;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"stage settings" "stage transport";column-gap:14px}
  .stage{grid-area:stage;min-height:0}
  .settings{grid-area:settings;min-height:0}
  .settings-in{overflow:auto}
  .transport{grid-area:transport}
  .app.active{grid-template-areas:"stage transport" "stage settings";grid-template-rows:auto 1fr}
}
@media (prefers-reduced-motion:reduce){ .glyph.pop{animation:none} .settings{transition:none} .paused .phase-name{animation:none} }
</style>

<div class="app" id="app" data-phase="idle">
  <section class="stage" id="stage" aria-label="Live display">
    <div class="meta">
      <span id="metaL" class="num">Letter Call</span>
      <span class="grow"></span>
      <span id="metaR" class="num"></span>
      <span class="wake" id="wake" title="Keeps the screen awake while a session runs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="wakeTxt"></span>
      </span>
      <button class="pill" id="installBtn" type="button" title="Install Letter Call as an app on this phone" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Install</button>
      <button class="icon-btn" id="fsBtn" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="glyph-wrap"><div class="glyph" id="glyph" data-len="4">0:00</div></div>
    <div class="phase"><span class="phase-name" id="phaseName">Ready</span><span class="phase-time" id="phaseTime"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <div class="settings" id="settings"><div class="settings-in">
    <fieldset id="cfgSet">
      <legend hidden>Session settings</legend>
      <div class="group">
        <div class="ghead">
          <span id="lettersHead">Letters</span>
          <span class="acts">
            <button class="mini" id="noRepeat" type="button" aria-pressed="true" title="Never call the same letter twice in a row">No repeat</button>
            <button class="mini" id="allBtn" type="button">All</button>
            <button class="mini" id="noneBtn" type="button">None</button>
          </span>
        </div>
        <div class="letters" id="letters" role="group" aria-label="Letters in the draw"></div>
      </div>

      <div class="group">
        <div class="ghead">
          <span>Timing · s</span>
          <span class="acts switches">
            <label class="switch" title="Pick each Before and After time at random between two values"><input type="checkbox" id="rangeToggle"> Random range</label>
            <label class="switch" title="Beep between letters, when the Before time starts"><input type="checkbox" id="betweenToggle" aria-label="Beep between letters"> Beep between</label>
          </span>
        </div>
        <div class="timing" id="timing">
          <span class="rlabel">Before</span>
          <div class="stepper" data-field="before"></div>
          <span class="to maxcol">to</span>
          <div class="stepper maxcol" data-field="beforeMax"></div>
          <span class="rlabel">After</span>
          <div class="stepper" data-field="after"></div>
          <span class="to maxcol">to</span>
          <div class="stepper maxcol" data-field="afterMax"></div>
        </div>
      </div>

      <div class="group">
        <div class="session">
          <div class="cell"><span class="clabel">Letters / cycle</span><div class="stepper" data-field="count"></div></div>
          <div class="cell"><span class="clabel">Cycles</span><div class="stepper" data-field="cycles"></div></div>
          <div class="cell"><span class="clabel">Rest · s</span><div class="stepper" data-field="rest"></div></div>
          <div class="cell"><span class="clabel">Get ready · s</span><div class="stepper" data-field="prep"></div></div>
          <div class="cell"><span class="clabel" title="Also play the beep this long before each letter">Pre-beep · s</span><div class="stepper" data-field="preBeep"></div></div>
          <div class="cell"><span class="clabel">Voice</span>
            <div class="seg" id="voiceSeg" role="group" aria-label="Voice (tap to hear it)">
              <button type="button" data-voice="bf_emma" title="Emma: tap to hear">Emma</button>
              <button type="button" data-voice="bm_george" title="George: tap to hear">George</button>
            </div>
          </div>
        </div>
      </div>
    </fieldset>
  </div></div>

  <div class="transport">
    <button class="btn" id="resetBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
    <button class="btn primary" id="mainBtn" type="button" data-mode="start"><span id="mainIco"></span><span id="mainTxt">Start</span></button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const STORE_KEY = 'letter-call-timer:v3';
const OLD_STORE_KEY = 'letter-call-timer:v2';   // settings saved before the pre-beep became on by default

/* ===================== Config ===================== */
// Timing fields are stored in tenths of a second (integers) to keep the arithmetic exact.
const FIELDS = {
  before:    { min: 0, max: 599, tenths: true },
  beforeMax: { min: 1, max: 600, tenths: true },
  after:     { min: 0, max: 599, tenths: true },
  afterMax:  { min: 1, max: 600, tenths: true },
  count:     { min: 1, max: 99 },
  cycles:    { min: 0, max: 99, inf: true },   // 0 = endless
  rest:      { min: 4, max: 600 },
  prep:      { min: 3, max: 60 },
  preBeep:   { min: 0, max: 30, tenths: true, off: true, on: 5 },   // 0 = off; first tap on + gives 0.5 s
};
// With the between-letter beep on, a pre-beep that would land this close (s) to it is skipped: they would sound like one.
const MIN_BEEP_GAP = 0.3;
const DEFAULTS = { letters: 'ABCD', noRepeat: false, range: false,
  before: 11, beforeMax: 20, after: 10, afterMax: 20, count: 12, cycles: 8, rest: 15, prep: 5, preBeep: 5, betweenBeep: true,
  voice: 'bf_emma' };

function loadCfg() {
  let c = { ...DEFAULTS };
  try {
    let s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!s) {   // carry over older settings, but give them the new pre-beep default unless it had been switched on
      s = JSON.parse(localStorage.getItem(OLD_STORE_KEY) || 'null');
      if (s && typeof s === 'object' && !(s.preBeep > 0)) delete s.preBeep;
    }
    if (s && typeof s === 'object') c = { ...c, ...s };
  } catch (e) {}
  for (const k in FIELDS) { const f = FIELDS[k]; c[k] = Math.min(f.max, Math.max(f.min, Math.round(+c[k] || 0))); }
  if (c.beforeMax <= c.before) c.beforeMax = c.before + 1;
  if (c.afterMax <= c.after) c.afterMax = c.after + 1;
  c.letters = ALPHA.filter((l) => String(c.letters).includes(l)).join('');
  if (!['bf_emma', 'bm_george'].includes(c.voice)) c.voice = DEFAULTS.voice;
  c.betweenBeep = c.betweenBeep !== false;
  return c;
}
const cfg = loadCfg();
function saveCfg() { try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {} }

function fmtField(k) {
  const f = FIELDS[k], v = cfg[k];
  if (f.inf && v === 0) return '∞';
  if (f.off && v === 0) return 'Off';
  return f.tenths ? (v / 10).toFixed(1) : String(v);
}
function setField(k, v) {
  const f = FIELDS[k];
  v = Math.min(f.max, Math.max(f.min, Math.round(v)));
  // Random-range rule: the second value must stay strictly above the first.
  if (k === 'beforeMax' && v <= cfg.before) v = cfg.before + 1;
  if (k === 'afterMax' && v <= cfg.after) v = cfg.after + 1;
  cfg[k] = v;
  if (k === 'before' && cfg.beforeMax <= v) cfg.beforeMax = v + 1;
  if (k === 'after' && cfg.afterMax <= v) cfg.afterMax = v + 1;
  saveCfg(); syncSettings();
}

/* ===================== Audio core ===================== */
let ctx = null, master, voiceBus, sfxBus;
let sessVoice = null, sessSfx = null;
const buffers = {};
let voicesReady = null;
const fallbackTimers = new Set();

function ensureAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createDynamicsCompressor();
    master.threshold.value = -8; master.knee.value = 6; master.ratio.value = 10; master.attack.value = 0.003; master.release.value = 0.15;
    master.connect(ctx.destination);
    voiceBus = gainNode(1.0, master);
    sfxBus = gainNode(0.55, master);
    ctx.onstatechange = () => { if (ctx.state !== 'running' && S.status === 'running' && !S.pausing) pause(true); };
    voicesReady = decodeVoices();
  }
  if (ctx.state !== 'running' && S.status !== 'paused') ctx.resume().catch(() => {});
  return ctx;
}
function gainNode(v, dest) { const g = ctx.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; }
function b64ToBuf(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function decodeVoices() {
  const data = window.VOICE_DATA || {};
  const jobs = [];
  for (const v in data) {
    buffers[v] = {};
    for (const k in data[v]) {
      jobs.push(new Promise((res) => {
        try { ctx.decodeAudioData(b64ToBuf(data[v][k]), (b) => { buffers[v][k] = b; res(); }, () => res()); } catch (e) { res(); }
      }));
    }
  }
  return Promise.all(jobs);
}
function newSessionBuses() {
  killSessionBuses();
  sessVoice = gainNode(1, voiceBus);
  sessSfx = gainNode(1, sfxBus);
}
function killSessionBuses() {
  for (const g of [sessVoice, sessSfx]) {
    if (!g) continue;
    try { const t = ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.05); } catch (e) {}
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 300);
  }
  sessVoice = sessSfx = null;
  fallbackTimers.forEach(clearTimeout); fallbackTimers.clear();
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
}

const SPOKEN = { three: 'Three', two: 'Two', one: 'One', stop: 'Stop!', rest: 'Rest', ready: 'Get ready', done: 'Well done!' };
function playClip(key, t, dest, voice) {
  const buf = buffers[voice || cfg.voice] && buffers[voice || cfg.voice][key];
  if (!buf) { speakFallback(key, t); return 0.6; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(dest || sessVoice || voiceBus); src.start(t);
  return buf.duration;
}
function speakFallback(key, t) {
  if (!('speechSynthesis' in window)) return;
  const id = setTimeout(() => {
    fallbackTimers.delete(id);
    try {
      const u = new SpeechSynthesisUtterance(SPOKEN[key] || key); u.lang = 'en-GB'; u.rate = 1.1;
      const v = speechSynthesis.getVoices().find((x) => /en[-_]GB/i.test(x.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }, Math.max(0, (t - ctx.currentTime) * 1000));
  fallbackTimers.add(id);
}
function tone(t, f, dur, peak, type, dest) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function beep(t) { // the tone between two letters
  const d = sessSfx || sfxBus;
  tone(t, 1175, 0.17, 0.9, 'triangle', d); tone(t, 2350, 0.1, 0.22, 'sine', d);
}
function blip(t) { tone(t, 740, 0.09, 0.45, 'triangle', sessSfx || sfxBus); }
function buzzer(t) {
  const d = sessSfx || sfxBus, lp = ctx.createBiquadFilter(), g = ctx.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 1500; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
  g.gain.setValueAtTime(0.5, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  lp.connect(g); g.connect(d);
  for (const f of [196, 207.6]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(t); o.stop(t + 0.45); }
}
function chime(t) { [1047, 1319, 1568, 2093].forEach((f, i) => tone(t + i * 0.11, f, 0.5, 0.35, 'sine', sessSfx || sfxBus)); }

/* ===================== Session engine ===================== */
// Timeline per cycle (times in seconds from Start):
//   [get ready / rest] → 3 · 2 · 1 → LETTER → after → beep → before → LETTER → … → after → STOP
let S = freshState();
function freshState() { return { status: 'idle', t0: 0, segs: [], sounds: [], seg: 0, snd: 0, built: 0, cursor: 0, last: null, end: Infinity, pausing: false, called: 0 }; }
const totalCycles = () => cfg.cycles || Infinity;
function rnd(lo, hi) { return cfg.range ? (lo + Math.floor(Math.random() * (hi - lo + 1))) / 10 : lo / 10; }
function pickLetter(prev) {
  const pool = cfg.letters.split('');
  const c = cfg.noRepeat && pool.length > 1 ? pool.filter((l) => l !== prev) : pool;
  return c[Math.floor(Math.random() * c.length)];
}
function appendCycle() {
  const c = S.built + 1;
  if (c > totalCycles()) return;
  const start = S.cursor, lead = c === 1 ? cfg.prep : cfg.rest, first = start + lead;
  S.segs.push({ k: c === 1 ? 'prep' : 'rest', a: start, b: first - 3, c });
  if (c === 1 && lead >= 4) S.sounds.push({ t: start, clip: 'ready' });
  ['three', 'two', 'one'].forEach((w, i) => {
    const t = first - 3 + i;
    S.segs.push({ k: 'count', n: 3 - i, a: t, b: t + 1, c });
    S.sounds.push({ t, clip: w, blip: true });
  });
  let t = first;
  for (let i = 1; i <= cfg.count; i++) {
    if (i > 1) {
      const w = rnd(cfg.before, cfg.beforeMax), seg = { k: 'wait', a: t, b: t + w, c, i };
      if (cfg.betweenBeep) S.sounds.push({ t, beep: true });
      // Optional pre-beep just before the letter. It sits inside the Before gap and never moves the letter.
      if (cfg.preBeep > 0) {
        const pt = Math.max(t, t + w - cfg.preBeep / 10);
        if (!cfg.betweenBeep || pt - t >= MIN_BEEP_GAP) { S.sounds.push({ t: pt, beep: true }); seg.pre = pt; }
      }
      S.segs.push(seg); t += w;
    }
    const L = pickLetter(S.last); S.last = L;
    const d = rnd(cfg.after, cfg.afterMax);
    S.sounds.push({ t, clip: L, letter: true }); S.segs.push({ k: 'go', L, a: t, b: t + d, c, i }); t += d;
  }
  S.sounds.push({ t, clip: 'stop', buzz: true });
  S.cursor = t; S.built = c;
  if (c === totalCycles()) {
    S.segs.push({ k: 'done', a: t, b: t + 2.6, c });
    S.sounds.push({ t: t + 0.9, clip: 'done', chime: true });
    S.end = t + 2.6;
  }
}
function fireSound(e, at) {
  if (e.beep) beep(at);
  if (e.blip) blip(at);
  if (e.buzz) buzzer(at);
  if (e.chime) chime(at + 0.05);
  if (e.clip) playClip(e.clip, e.buzz ? at + 0.04 : at);
  if (e.letter) S.called++;
}

async function start() {
  if (!cfg.letters) return;
  if (!ensureAudio()) return;
  try { await ctx.resume(); } catch (e) {}
  await Promise.race([voicesReady, new Promise((r) => setTimeout(r, 1500))]);
  newSessionBuses();
  S = freshState(); S.status = 'running';
  S.t0 = ctx.currentTime + 0.12;
  appendCycle(); appendCycle();
  requestWake(); syncUI(); tick();
}
function pause(fromSystem) {
  if (S.status !== 'running') return;
  S.status = 'paused'; S.pausing = true;
  if (!fromSystem) ctx.suspend().catch(() => {}).finally(() => { S.pausing = false; });
  else S.pausing = false;
  syncUI();
}
async function resume() {
  if (S.status !== 'paused') return;
  try { await ctx.resume(); } catch (e) {}
  S.status = 'running'; requestWake(); syncUI();
}
function reset() {
  killSessionBuses();
  S = freshState();
  if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  releaseWake(); syncUI(); renderIdle();
}
function finish() {
  S.status = 'done';
  releaseWake(); syncUI();
}

/* ===================== Clock & rendering ===================== */
function advanceSeg(now) { while (S.seg < S.segs.length - 1 && S.segs[S.seg].b <= now) S.seg++; }
function tick() {
  if (!ctx) return;
  const now = ctx.currentTime;
  if (S.status === 'running') {
    advanceSeg(now - S.t0);
    const cur = S.segs[S.seg];
    if (cur && cur.c >= S.built) appendCycle();
    while (S.snd < S.sounds.length && S.t0 + S.sounds[S.snd].t < now + 0.15) {
      const e = S.sounds[S.snd++]; fireSound(e, Math.max(now, S.t0 + e.t));
    }
    if (now - S.t0 >= S.end) finish();
  }
}
setInterval(tick, 25);

const el = { app: $('#app'), glyph: $('#glyph'), phaseName: $('#phaseName'), phaseTime: $('#phaseTime'), bar: $('#barFill'),
  metaL: $('#metaL'), metaR: $('#metaR'), main: $('#mainBtn'), mainTxt: $('#mainTxt'), mainIco: $('#mainIco'), reset: $('#resetBtn'),
  cfgSet: $('#cfgSet'), wake: $('#wake'), wakeTxt: $('#wakeTxt') };
const last = {};
function put(key, node, prop, val) { if (last[key] !== val) { last[key] = val; if (prop === 'text') node.textContent = val; else if (prop === 'width') node.style.width = val; else node.setAttribute(prop, val); } }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
function setGlyph(txt, kind) {
  put('g', el.glyph, 'text', txt); put('gl', el.glyph, 'data-len', String(Math.min(5, Math.max(1, [...txt].length))));
  put('gk', el.glyph, 'data-k', kind || '');
}
function setPhase(p) { put('ph', el.app, 'data-phase', p); }
function popGlyph() { el.glyph.classList.remove('pop'); void el.glyph.offsetWidth; el.glyph.classList.add('pop'); }

function estimate() {
  const n = cfg.count;
  const a = cfg.range ? (cfg.after + cfg.afterMax) / 20 : cfg.after / 10;
  const b = cfg.range ? (cfg.before + cfg.beforeMax) / 20 : cfg.before / 10;
  const cyc = n * a + (n - 1) * b;
  if (!cfg.cycles) return { inf: true, cyc };
  return { total: cfg.prep + cfg.cycles * cyc + (cfg.cycles - 1) * cfg.rest, cyc };
}
function renderIdle() {
  if (S.status !== 'idle') return;
  setPhase('idle');
  const e = estimate();
  if (!cfg.letters) {
    setGlyph('–'); put('pn', el.phaseName, 'text', 'Pick at least one letter'); put('pt', el.phaseTime, 'text', '');
  } else {
    setGlyph(e.inf ? '∞' : fmtClock(e.total));
    put('pn', el.phaseName, 'text', e.inf ? 'Endless cycles' : (cfg.range ? 'Session ≈' : 'Session'));
    put('pt', el.phaseTime, 'text', fmtClock(e.cyc) + ' / cycle');
  }
  put('ml', el.metaL, 'text', 'Letter Call');
  put('mr', el.metaR, 'text', (cfg.cycles ? cfg.cycles : '∞') + ' × ' + cfg.count + ' letters');
  put('bw', el.bar, 'width', '0%');
}

let lastSegRef = null;
function frame() {
  requestAnimationFrame(frame);
  if (!ctx || (S.status !== 'running' && S.status !== 'paused' && S.status !== 'done')) return;
  const now = ctx.currentTime - S.t0;
  if (S.status === 'done') {
    setPhase('done');
    setGlyph('DONE'); put('pn', el.phaseName, 'text', 'Well done');
    put('pt', el.phaseTime, 'text', S.called + ' calls'); put('bw', el.bar, 'width', '0%');
    put('mr', el.metaR, 'text', fmtClock(S.end)); put('ml', el.metaL, 'text', 'Finished');
    return;
  }
  advanceSeg(now);
  const g = S.segs[S.seg];
  if (!g) return;
  const tc = totalCycles(), cyc = 'Cycle ' + g.c + (tc === Infinity ? '' : '/' + tc);
  let phase = g.k, glyph = '', name = '', kind = '', remain = Math.max(0, g.b - now), span = Math.max(0.001, g.b - g.a);
  let metaR = '';
  switch (g.k) {
    case 'prep': glyph = String(Math.ceil(g.b + 3 - now - 1e-6)); name = 'Get ready'; metaR = cfg.count + ' letters'; remain = g.b + 3 - now; span = g.b + 3 - g.a; break;
    case 'count': glyph = String(g.n); name = g.n === 1 ? 'Here we go' : 'Get set'; metaR = cfg.count + ' letters'; break;
    case 'go': glyph = g.L; name = 'Go'; kind = 'go'; metaR = 'Letter ' + g.i + '/' + cfg.count; break;
    case 'wait': {
      const armed = g.pre != null && now >= g.pre;
      glyph = ''; kind = armed ? 'armed' : 'wait'; name = armed ? 'Ready' : 'Next call'; metaR = 'Letter ' + (g.i) + '/' + cfg.count;
      break;
    }
    case 'rest':
      if (now - g.a < 1.1) { phase = 'stop'; glyph = 'STOP'; name = 'Stop'; }
      else { glyph = String(Math.ceil(g.b + 3 - now - 1e-6)); name = 'Rest'; }
      remain = g.b + 3 - now; span = g.b + 3 - g.a; metaR = 'Next ' + g.c + (tc === Infinity ? '' : '/' + tc);
      break;
    case 'done': phase = 'stop'; glyph = 'STOP'; name = 'Stop'; metaR = 'Last cycle'; remain = 0; break;
  }
  if (g.k === 'rest') put('ml', el.metaL, 'text', 'Cycle ' + (g.c - 1) + (tc === Infinity ? '' : '/' + tc) + ' done');
  else put('ml', el.metaL, 'text', cyc);
  setPhase(phase);
  const prevKind = last.gk;
  setGlyph(glyph, kind);
  if (kind === 'armed' && prevKind !== 'armed') popGlyph();
  if (g !== lastSegRef) { lastSegRef = g; if (g.k === 'go' || g.k === 'count') popGlyph(); }
  put('pn', el.phaseName, 'text', S.status === 'paused' ? 'Paused' : name);
  put('pt', el.phaseTime, 'text', remain > 0 ? remain.toFixed(1) + ' s' : '');
  put('bw', el.bar, 'width', (Math.min(1, remain / span) * 100).toFixed(2) + '%');
  put('mr', el.metaR, 'text', metaR);
}
requestAnimationFrame(frame);

/* ===================== Wake lock & full screen ===================== */
let wakeLock = null;
async function requestWake() {
  try {
    if (!('wakeLock' in navigator)) throw new Error('unsupported');
    wakeLock = await navigator.wakeLock.request('screen');
    setWake('on');
    wakeLock.addEventListener('release', () => { wakeLock = null; if (S.status === 'running' && !document.hidden) setWake('off'); });
  } catch (e) { setWake('off'); }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; setWake(''); }
function setWake(s) {
  el.wake.dataset.state = s;
  el.wakeTxt.textContent = s === 'off' ? 'Screen may dim' : '';
  el.wake.title = s === 'on' ? 'Screen stays on during the session' : 'The browser refused to keep the screen on. Raise your screen timeout in Android settings.';
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.status === 'running') pause(); }
  else if ((S.status === 'running' || S.status === 'paused') && !wakeLock) requestWake();
});
const fsBtn = $('#fsBtn');
if (document.fullscreenEnabled) {
  fsBtn.hidden = false;
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  });
}

/* ===================== Install as an app (only offered when the page is hosted with its manifest) ===================== */
let installEvt = null;
const installBtn = $('#installBtn');
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; installBtn.hidden = true; });
installBtn.addEventListener('click', async () => {
  if (!installEvt) return;
  try { installEvt.prompt(); await installEvt.userChoice; } catch (e) {}
  installEvt = null; installBtn.hidden = true;
});
if (window.LCT_PWA && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ===================== Controls ===================== */
const ICONS = {
  start: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>',
};
function syncUI() {
  const st = S.status, active = st === 'running' || st === 'paused';
  el.app.classList.toggle('active', active);
  el.app.classList.toggle('paused', st === 'paused');
  el.cfgSet.disabled = active;
  el.reset.disabled = st === 'idle';
  const mode = st === 'running' ? 'pause' : 'start';
  el.main.dataset.mode = mode;
  el.mainIco.innerHTML = ICONS[mode];
  el.mainTxt.textContent = st === 'running' ? 'Pause' : st === 'paused' ? 'Resume' : st === 'done' ? 'Again' : 'Start';
  el.main.disabled = !cfg.letters && !active;
  if (st === 'idle') renderIdle();
}
el.main.addEventListener('click', () => {
  ensureAudio();
  if (S.status === 'running') pause();
  else if (S.status === 'paused') resume();
  else { if (S.status === 'done') { killSessionBuses(); S = freshState(); } start(); }
});
el.reset.addEventListener('click', reset);

// Letters
const lettersEl = $('#letters');
ALPHA.forEach((L) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = L; b.dataset.l = L;
  b.addEventListener('click', () => {
    const set = new Set(cfg.letters.split('')); set.has(L) ? set.delete(L) : set.add(L);
    cfg.letters = ALPHA.filter((x) => set.has(x)).join(''); saveCfg(); syncSettings();
  });
  lettersEl.appendChild(b);
});
$('#allBtn').addEventListener('click', () => { cfg.letters = ALPHA.join(''); saveCfg(); syncSettings(); });
$('#noneBtn').addEventListener('click', () => { cfg.letters = ''; saveCfg(); syncSettings(); });
$('#noRepeat').addEventListener('click', () => { cfg.noRepeat = !cfg.noRepeat; saveCfg(); syncSettings(); });
const rangeToggle = $('#rangeToggle');
rangeToggle.addEventListener('change', () => { cfg.range = rangeToggle.checked; saveCfg(); syncSettings(); });
const betweenToggle = $('#betweenToggle');
betweenToggle.addEventListener('change', () => { cfg.betweenBeep = betweenToggle.checked; saveCfg(); syncSettings(); });

const LABELS = { before: 'Seconds before a letter', beforeMax: 'Longest time before a letter', after: 'Seconds after a letter',
  afterMax: 'Longest time after a letter', count: 'Letters per cycle', cycles: 'Number of cycles', rest: 'Rest between cycles in seconds', prep: 'Get ready time in seconds',
  preBeep: 'Seconds before each letter to also beep, or Off' };
// Steppers: tap for one step, hold to repeat (speeds up the longer you hold).
document.querySelectorAll('.stepper').forEach((box) => {
  const k = box.dataset.field, f = FIELDS[k];
  box.innerHTML = '<button type="button" aria-label="Decrease">−</button><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false"><button type="button" aria-label="Increase">+</button>';
  const [dec, inp, inc] = box.children;
  inp.id = 'f-' + k; inp.setAttribute('aria-label', LABELS[k]);
  dec.setAttribute('aria-label', 'Decrease ' + LABELS[k]); inc.setAttribute('aria-label', 'Increase ' + LABELS[k]);
  const bindHold = (btn, dir) => {
    let timer = 0, t0 = 0;
    const stepOnce = () => { const held = performance.now() - t0; const mult = held > 2600 ? 10 : held > 1200 ? 5 : 1; bump(dir * mult); };
    const bump = (d) => { if (f.off && cfg[k] === 0 && d > 0) setField(k, f.on); else setField(k, cfg[k] + d); };
    const stop = () => { clearTimeout(timer); timer = 0; };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return; e.preventDefault(); btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
      t0 = performance.now(); stepOnce();
      const rep = () => { stepOnce(); timer = setTimeout(rep, 70); };
      timer = setTimeout(rep, 420);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('click', (e) => { if (e.detail === 0) bump(dir); }); // keyboard
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  };
  bindHold(dec, -1); bindHold(inc, +1);
  const commit = () => {
    const raw = inp.value.trim().replace(',', '.');
    if ((f.inf || f.off) && (raw === '' || raw === '∞' || raw === '0' || /^off$/i.test(raw))) { setField(k, 0); return; }
    const n = parseFloat(raw);
    if (isNaN(n)) { syncSettings(); return; }
    setField(k, f.tenths ? Math.round(n * 10) : n);
  };
  inp.addEventListener('change', commit);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { inp.blur(); } });
  inp.addEventListener('focus', () => setTimeout(() => inp.select(), 0));
});

// Voice
document.querySelectorAll('#voiceSeg button').forEach((b) => {
  b.addEventListener('click', async () => {
    cfg.voice = b.dataset.voice; saveCfg(); syncSettings();
    if (!ensureAudio()) return;
    await voicesReady;
    const pool = cfg.letters ? cfg.letters.split('') : ALPHA;
    playClip(pool[Math.floor(Math.random() * pool.length)], ctx.currentTime + 0.02, voiceBus, cfg.voice);
  });
});

function syncSettings() {
  lettersEl.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', cfg.letters.includes(c.dataset.l) ? 'true' : 'false'));
  const n = cfg.letters.length;
  const head = $('#lettersHead');
  head.textContent = n ? 'Letters · ' + n : 'Pick a letter';
  head.classList.toggle('hint-bad', !n);
  $('#noRepeat').setAttribute('aria-pressed', cfg.noRepeat ? 'true' : 'false');
  rangeToggle.checked = cfg.range;
  betweenToggle.checked = cfg.betweenBeep;
  $('#timing').classList.toggle('range-off', !cfg.range);
  document.querySelectorAll('.stepper').forEach((box) => {
    const k = box.dataset.field, inp = box.children[1];
    if (document.activeElement !== inp) inp.value = fmtField(k);
    const off = (k === 'beforeMax' || k === 'afterMax') && !cfg.range;
    box.querySelectorAll('button,input').forEach((x) => { x.disabled = off; });
  });
  document.querySelectorAll('#voiceSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.voice === cfg.voice ? 'true' : 'false'));
  syncUI();
}
syncSettings();

// Warm up the audio engine on the first touch so Start responds instantly.
window.addEventListener('pointerdown', () => { ensureAudio(); }, { once: true, capture: true });
})();
</script>
